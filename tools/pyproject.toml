[project]
name = "gf-tools"
version = "0.1.0"
description = "Game-factory tooling outside the engine: procedural art generation (more to come: balancing, content, store metadata)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gen-art = "gf_tools.art.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gf_tools"]

[dependency-groups]
dev = []
